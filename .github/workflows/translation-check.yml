name: Translation Check

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  check-translations:
    runs-on: ubuntu-latest

    steps:
      # Check out R-Instat code
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0   

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Run translation check
        id: translation-check
        run: |
          set +e
          python scripts/check_translations.py --ci > translation-report.txt 2>&1
          status=$?
          cat translation-report.txt
          exit $status

      - name: Add PR comment with results
        if: always()
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            let report = '';
            try {
              report = fs.readFileSync('translation-report.txt', 'utf8');
            } catch (e) {
              report = 'Translation check completed (no detailed report available)';
            }

            const summaryMatch = report.match(/<!-- translation-check-report:start -->[\s\S]*?<!-- translation-check-report:end -->/);
            const summary = summaryMatch ? summaryMatch[0] : report.substring(0, 2000);

            const failed = '${{ steps.translation-check.outcome }}' === 'failure';
            const fixHint = failed
              ? `\n\n**Missing translations detected.** Run \`python scripts/sync_translations.py\` locally and commit the updated \`instat/translations/en/*.json\`.`
              : '';

            const body = `${summary}${fixHint}\n\n---\n*This comment is automatically updated by the translation check workflow.*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' &&
              c.body.includes('<!-- translation-check-report:start -->')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body
              });
            }
